name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_TABS_VERSION: 1.0.4

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install mdbook-tabs
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sSL "https://github.com/RustForWeb/mdbook-plugins/releases/download/v${MDBOOK_TABS_VERSION}/mdbook-tabs-v${MDBOOK_TABS_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Build book
        run: mdbook build docs

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book
          retention-days: 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/book
          keep_files: true

  deploy-preview:
    # needs: build normally waits for a *successful* build, which would also
    # skip this job when build itself is skipped (closed PRs, see build's own
    # `if`) — but a closed PR still needs this job to run its teardown/cleanup
    # step, which needs no build output at all. Runs whenever build wasn't
    # skipped for any reason other than closing.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/book
          preview-branch: gh-pages
          pages-base-url: zanylights.com/homelab
