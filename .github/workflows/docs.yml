name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mdBook/mdbook-tabs versions are pinned once, in mise.toml — no
      # separate version env vars to keep in sync here. Scoped to just the
      # docs tools (install_args) rather than the whole toolchain, since this
      # job doesn't need OpenTofu/Terragrunt/kubectl/etc. `rust` has to be
      # listed explicitly alongside `cargo:mdbook-tabs` (not left to resolve
      # via install_args' scoping alone) — mise.toml pins rust's version, and
      # once a tool has a configured version pin, mise's cargo backend
      # requires it to actually be installed rather than silently falling
      # back to whatever cargo happens to be on the runner's PATH. Found live
      # as a real CI failure when this was just "mdbook cargo:mdbook-tabs".
      - uses: jdx/mise-action@v4
        with:
          install_args: "mdbook rust cargo:mdbook-tabs"

      - name: Build book
        run: mdbook build docs

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book
          retention-days: 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/book
          keep_files: true

  deploy-preview:
    # needs: build normally waits for a *successful* build, which would also
    # skip this job when build itself is skipped (closed PRs, see build's own
    # `if`) — but a closed PR still needs this job to run its teardown/cleanup
    # step, which needs no build output at all. Runs whenever build wasn't
    # skipped for any reason other than closing.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: book
          path: docs/book

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/book
          preview-branch: gh-pages
          pages-base-url: zanylights.com/homelab
