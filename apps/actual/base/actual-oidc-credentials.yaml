# Mirrors keycloak-realm's kubernetes_secret.actual_oidc_client_secret
# (namespace keycloak-secrets) via ESO's kubernetes-provider ClusterSecretStore
# (apps/cluster-addons/base/) — automatically stays current across a
# keycloak-realm destroy/recreate or a deliberate secret rotation, no manual
# terragrunt output/hand-carry step (#42). See docs/src/bootstrap-environment/06-gitops.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-oidc-credentials
  namespace: actual
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: actual-oidc-credentials
  data:
    - secretKey: client-secret
      remoteRef:
        key: actual-oidc-client-secret
        property: client-secret
