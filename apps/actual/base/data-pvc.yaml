# Actual's entire server state (account.sqlite + every budget file, each a
# SQLite DB in its own right) lives under one data directory — Ceph-backed,
# not NFS, for the same file-locking-correctness reason as every other
# SQLite-on-Kubernetes app in this repo (see
# docs/src/bootstrap-environment/13-ceph-storage.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-data
  namespace: actual
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: __STORAGE_CLASS_CEPH__
  resources:
    requests:
      storage: 5Gi
