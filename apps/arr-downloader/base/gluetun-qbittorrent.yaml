# Gluetun (https://github.com/qdm12/gluetun) + qBittorrent
# (https://github.com/hotio/qbittorrent), deliberately two containers in one
# pod rather than two separate Deployments -- Kubernetes' network-namespace-
# sharing unit is the pod, and that's the only way qBittorrent's traffic
# actually transits Gluetun's WireGuard tunnel (the classic Docker
# `network_mode: service:gluetun` pattern has no separate-Deployment
# equivalent in Kubernetes). See docs/src/explanation/arr-stack.md for the
# full architecture and why this is the one privileged-PSA namespace in this
# repo's arr-stack/arr-downloader split.
#
# strategy: Recreate for two independent reasons: the RWO config PVC (a
# rolling update would try to schedule the new pod before the old one
# releases the volume, same reasoning as every other RWO-PVC app here), and
# a documented Gluetun-specific gotcha -- Kubernetes shares IP rules across
# the whole pod, and a RollingUpdate can leave stale IP rules from the old
# pod conflicting with the new one's tunnel setup.
#
# qBittorrent's own default save path still needs pointing at
# /media/Downloads by hand via its WebUI (Options > Downloads > Default Save
# Path) after first boot -- no env var controls this on hotio's image,
# same "managed by hand" precedent as Jellyfin's SSO plugin config.
#
# Gluetun is a native sidecar (initContainers with restartPolicy: Always,
# stable since Kubernetes 1.29) rather than a regular container -- found
# live that without this, qBittorrent starts and binds its listening/DHT
# sockets before Gluetun's tunnel is actually up (both containers in a pod
# start roughly simultaneously, with no ordering guarantee otherwise).
# qBittorrent's own log confirmed it: on every restart, including a fully
# fresh one, its DHT/listen sockets bound only to the pod's normal eth0 IP
# and loopback -- never to tun0 -- and it doesn't rebind once tun0
# appears afterward, so DHT/peer/tracker traffic silently never touched
# the tunnel at all despite the tunnel itself working fine (confirmed via
# a direct curl and a raw DHT UDP ping from inside the pod, both
# succeeding through tun0). Gluetun's startupProbe below (hitting its own
# health endpoint, which only returns 200 once the VPN is actually
# healthy) is what makes this a real ordering gate, not just a container
# list reorder -- Kubernetes holds qBittorrent's container creation until
# it passes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun-qbittorrent
  namespace: arr-downloader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gluetun-qbittorrent
  template:
    metadata:
      labels:
        app: gluetun-qbittorrent
      annotations:
        # Opts qBittorrent's config volume (its SQLite-backed torrent/
        # session state) into Velero's File System Backup, per the standing
        # rule that every Ceph-backed workload gets this. The downloads
        # volume deliberately gets none -- see downloads-pv.yaml.
        backup.velero.io/backup-volumes: "qbittorrent-config"
    spec:
      enableServiceLinks: false
      # No pod-level runAsNonRoot/runAsUser: Gluetun needs to run with the
      # NET_ADMIN capability to build its tunnel and manage its own
      # iptables-based kill switch, which this repo's other apps never
      # need -- this is the one pod in the one namespace where that's
      # actually allowed (privileged PSA, see namespace.yaml). qBittorrent's
      # own container also needs to start as root (see its own comment
      # below) -- found live, not the defense-in-depth non-root uid
      # originally planned here.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: gluetun
          # restartPolicy: Always is what makes this a native sidecar
          # rather than a one-shot init step -- it keeps running for the
          # pod's whole lifetime, and Kubernetes holds qBittorrent's own
          # container start until this container's startupProbe (below)
          # first succeeds.
          restartPolicy: Always
          image: ghcr.io/qdm12/gluetun:v3.41.1
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            # Switched from protonvpn to mullvad -- found live that Proton's
            # free plan blocks P2P/torrent traffic outright (confirmed
            # against Proton's own docs), a hard provider-level ceiling no
            # config change here could fix. Mullvad allows P2P on every
            # server, no special subset to find, and (unlike Proton) has no
            # free tier at all -- a real paid subscription, registered via
            # a locally-generated WireGuard keypair uploaded through
            # Mullvad's account portal (Advanced > Create device) rather
            # than a portal-generated config -- the private key here never
            # left this machine.
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: SERVER_COUNTRIES
              value: Switzerland
            # Allows inbound traffic to qBittorrent's WebUI (8080) and
            # Gluetun's own HTTP proxy (8888, see below) through Gluetun's
            # default-deny-inbound firewall -- separate from, and in
            # addition to, the Kubernetes NetworkPolicy ingress rule in
            # network-policies.yaml. Without this, Sonarr/Radarr/Prowlarr's
            # own traffic can reach the pod's IP at the CNI level but still
            # get dropped by Gluetun's internal iptables.
            - name: FIREWALL_INPUT_PORTS
              value: "8080,8888"
            # Gluetun's built-in HTTP proxy -- lets Sonarr/Radarr/Prowlarr
            # (which stay in arr-stack, not this privileged namespace) route
            # specific outbound traffic through this tunnel without sharing
            # this pod's network namespace, via a plain HTTP proxy setting
            # on each app's own side. See network-policies.yaml for the
            # cross-namespace rule that allows arr-stack to reach this port,
            # and docs/src/explanation/arr-stack.md for why this has no
            # per-purpose granularity (it's all-or-nothing past each app's
            # own proxy bypass list).
            - name: HTTPPROXY
              value: "on"
            - name: HTTPPROXY_LISTENING_ADDRESS
              value: ":8888"
            # 0.0.0.0, not the 127.0.0.1 default, so Kubernetes' own
            # kubelet-executed probes (which hit the pod IP, not localhost)
            # can actually reach it.
            - name: HEALTH_SERVER_ADDRESS
              value: "0.0.0.0:9999"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: vpn-credentials
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: vpn-credentials
                  key: wireguard-addresses
          # Gates qBittorrent's container start -- see this file's
          # top-of-file comment. periodSeconds x failureThreshold allows up
          # to 2 minutes: Gluetun retries individual Mullvad servers on its
          # own (each attempt takes a few seconds), and was observed live
          # cycling through 4-5 before landing on one that passed its own
          # healthcheck, taking ~30-40s in practice -- generous headroom
          # over that.
          startupProbe:
            httpGet:
              path: /
              port: 9999
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: qbittorrent
          # hotio's image over linuxserver.io's -- chosen expecting
          # rootless-first behaviour, but found live to use the identical
          # s6-overlay root-start-then-drop-to-PUID/PGID model
          # linuxserver.io's images use: dropping ALL capabilities (as this
          # container originally did) left even root unable to chown
          # /config during s6-overlay's preinit, crash-looping with "chown:
          # changing ownership of '/config': Operation not permitted".
          # Fine to let it start as root here specifically -- this is
          # already the one privileged-PSA namespace in this repo, so
          # nothing is lost that wasn't already permitted at the namespace
          # level. hotio doesn't publish immutable per-version tags the way
          # this repo otherwise prefers (only floating release/testing/
          # nightly channels) -- :release is their documented stable
          # channel, the closest available; re-pin if hotio ever adds
          # versioned tags.
          image: ghcr.io/hotio/qbittorrent:release
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /media/Downloads
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: arr-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: arr-downloader
spec:
  selector:
    app: gluetun-qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gluetun-proxy
  namespace: arr-downloader
spec:
  selector:
    app: gluetun-qbittorrent
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: arr-downloader
  annotations:
    # No ssl-redirect/cert-manager annotations here -- oauth2-proxy's own
    # Ingress (same host, qbittorrent-oauth2-proxy.yaml) owns the actual
    # Certificate, same as every other app's oauth2-proxy pairing.
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.arr-downloader.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://__APP_HOSTNAME__/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
spec:
  ingressClassName: nginx
  rules:
    - host: __APP_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
  tls:
    - hosts:
        - __APP_HOSTNAME__
      secretName: qbittorrent-tls
