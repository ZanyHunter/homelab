# Default-deny + only the traffic this namespace actually needs, same
# pattern as every other namespace in this repo (#31) -- plus two genuinely
# new shapes of rule this app needs, called out below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: arr-downloader
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: arr-downloader
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Costs nothing even though nothing in this namespace actually needs it today
# (oauth2-proxy only ever answers its own /oauth2/* paths, same
# static://202 upstream pattern as every other app's oauth2-proxy here) --
# same reasoning as matrix's identical no-op rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: arr-downloader
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# ingress-nginx -> qBittorrent's own Ingress ("/" path) and oauth2-proxy's
# ("/oauth2" path, plus its own auth-url subrequest for qBittorrent's
# Ingress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-ingress
  namespace: arr-downloader
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# oauth2-proxy's own OIDC calls (discovery/token/jwks) go to the *external*
# keycloak.<domain_name> hostname, which resolves back through
# ingress-nginx's LoadBalancer IP -- same pattern as every other app's
# oauth2-proxy here. Scoped to the oauth2-proxy pod specifically (not the
# whole namespace) since the gluetun-qbittorrent pod's own egress is covered
# by the dedicated VPN-establishment rule below instead -- it has no reason
# to reach ingress-nginx directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-egress
  namespace: arr-downloader
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# New shape #1: WireGuard tunnel establishment. Applies to the whole
# gluetun-qbittorrent pod (NetworkPolicy is enforced per-pod regardless of
# which container in it originates the traffic), scoped by the pod's own
# label rather than namespace-wide. Can't pin the destination to a specific
# IP the way most egress rules in this repo do -- the VPN provider's
# WireGuard endpoint isn't a fixed, knowable-in-advance address any more
# than LiveKit's STUN-detection egress target was (apps/matrix-livekit/base/
# network-policies.yaml) -- so this is 0.0.0.0/0 like that rule, not a
# scoped ipBlock.
#
# No port restriction, unlike every other egress rule in this repo --
# initially scoped to just 51820/UDP (WireGuard) + 443/TCP (Gluetun's own
# startup calls), which turned out to be wrong for a fundamentally different
# reason than the tun0-vs-NetworkPolicy question below: BitTorrent itself
# needs arbitrary destination ports (DHT, peer connections, tracker
# announces all use ports the client doesn't control), so a real download
# stalled at 0% with dht_nodes: 0 in qBittorrent's own /api/v2/transfer/info
# until this was widened. Confirmed live: widening this rule alone did NOT
# fix that specific stall -- the actual root cause was Proton's free plan
# blocking P2P/torrent traffic outright at the provider level (confirmed
# against Proton's own https://protonvpn.com/torrenting: "you'll need a
# paid plan to use our dedicated P2P servers"), a separate, unrelated
# problem this widened rule doesn't solve by itself. Kept widened anyway
# since it's the objectively correct shape for a torrent client regardless
# of which VPN tier is in use -- confirmed still correct after switching
# the provider to Mullvad (which allows P2P on every server, unlike
# Proton's free plan) -- see docs/src/explanation/arr-stack.md.
#
# Open question, not assumed: once Gluetun's tunnel is up, qBittorrent's own
# internet-bound torrent traffic exits via Gluetun's internal tun0 interface
# rather than the pod's CNI-attached eth0 -- whether Kubernetes NetworkPolicy
# enforcement (typically eth0-scoped, CNI-dependent) actually constrains
# tun0 traffic is still unverified (widening this rule and the stall
# persisting doesn't resolve the question, since the real blocker turned
# out to be upstream of the tunnel entirely). Gluetun's own internal
# iptables kill switch is the real leak-prevention mechanism regardless of
# how this cluster's CNI handles it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vpn-establishment-egress
  namespace: arr-downloader
spec:
  podSelector:
    matchLabels:
      app: gluetun-qbittorrent
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
---
# New shape #2: cross-namespace pod-to-pod traffic, second use of the
# precedent Matrix Authentication Service established (apps/matrix-mas/base/
# network-policies.yaml, apps/matrix/base/network-policies.yaml) -- the first
# NetworkPolicy shape in this repo naming another app's namespace directly
# rather than kube-system/ingress-nginx. Sonarr/Radarr (apps/arr-stack/) call
# qBittorrent's Web API directly -- to submit/monitor downloads -- rather
# than through its oauth2-proxy-gated Ingress, the same way every other
# internal service-to-service call in this repo bypasses its target's
# forward-auth layer. Only one direction is needed here (Sonarr/Radarr
# initiate; qBittorrent never calls back into arr-stack), unlike MAS <->
# Synapse's bidirectional relationship.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-stack-namespace-ingress
  namespace: arr-downloader
spec:
  podSelector:
    matchLabels:
      app: gluetun-qbittorrent
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr-stack
      ports:
        - port: 8080
          protocol: TCP
        # Gluetun's own built-in HTTP proxy (see gluetun-qbittorrent.yaml) --
        # matches arr-stack's allow-arr-downloader-proxy-egress rule.
        # Sonarr/Radarr/Prowlarr (and Byparr) all reach this port to route
        # specific outbound traffic through the VPN tunnel while staying
        # outside this privileged namespace themselves.
        - port: 8888
          protocol: TCP
