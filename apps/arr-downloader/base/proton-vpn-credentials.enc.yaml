# Sourced from a WireGuard config generated at account.protonvpn.com
# (server CH-FREE#11, endpoint 135.136.39.34:51820 -- matches this repo's
# network-policies.yaml's 51820/UDP egress rule). Proton's free plan allows
# exactly one simultaneous connection -- dev and prod can't both hold an
# active tunnel on this account. See docs/src/explanation/arr-stack.md.
