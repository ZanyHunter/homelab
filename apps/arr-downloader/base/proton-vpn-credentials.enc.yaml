# Proton VPN free-tier WireGuard credentials for Gluetun -- no Tofu
# counterpart exists for these (Proton doesn't originate from this repo's
# own generated state), same category as oauth2-proxy's cookie secrets, so
# this stays ksops-encrypted rather than an ExternalSecret.
#
# REPLACE THE PLACEHOLDER VALUES BELOW before first apply: log into
# account.protonvpn.com, WireGuard configuration -> generate a new config
# (any platform/router option works, the values are protocol-level, not
# platform-specific) -- copy the [Interface] section's PrivateKey into
# wireguard-private-key and Address into wireguard-addresses below, then
# re-encrypt with `sops -e -i apps/arr-downloader/base/proton-vpn-credentials.enc.yaml`.
#
# Known constraint, not solved here: Proton's free plan allows exactly one
# simultaneous connection -- dev and prod can't both hold an active tunnel
# on the same account. See docs/src/explanation/arr-stack.md.
apiVersion: v1
kind: Secret
