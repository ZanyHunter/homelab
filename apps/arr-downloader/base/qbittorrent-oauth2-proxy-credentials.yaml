# Mirrors keycloak-realm's kubernetes_secret.qbittorrent_oauth2_proxy_client_secret
# (namespace keycloak-secrets) via ESO's kubernetes-provider ClusterSecretStore
# (apps/cluster-addons/base/) -- same mechanism as every other oauth2-proxy
# app here (#42). client-id rides along even though it isn't actually
# sensitive, same shape as pinchflat-oauth2-proxy-credentials.yaml.
# cookie-secret has no Tofu counterpart and stays ksops-encrypted
# (qbittorrent-oauth2-proxy-cookie-secret.enc.yaml). See
# docs/src/explanation/gitops-app-of-apps.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-oauth2-proxy-credentials
  namespace: arr-downloader
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: qbittorrent-oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: qbittorrent-oidc-client-secret
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: qbittorrent-oidc-client-secret
        property: client-secret
