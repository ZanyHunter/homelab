# Mullvad WireGuard credentials for Gluetun -- no Tofu counterpart exists
# for these (Mullvad doesn't originate from this repo's own generated
# state), same category as oauth2-proxy's cookie secrets, so this stays
# ksops-encrypted rather than an ExternalSecret.
#
# Switched from Proton (apps/arr-downloader/base/gluetun-qbittorrent.yaml
# has the full story: Proton's free plan blocks P2P/torrent traffic
# outright, a hard provider-level ceiling). Registered via a locally-
# generated WireGuard keypair (X25519, generated with Python's
# `cryptography` library since neither `wg genkey` nor sudo/apt were
# available in this session) uploaded as a public key through Mullvad's
# account portal (My devices > Advanced > Create device) -- the private
# key below never left this machine, unlike Proton's own portal-generated-
# config flow. wireguard-addresses is the IPv4 Mullvad assigned to this
# device, shown on its own device page after creation.
#
# To rotate: generate a fresh keypair, upload the new public key as a new
# device on Mullvad's portal, update both values below, re-encrypt with
# `sops -e -i`, then remove the old device from Mullvad's portal.
