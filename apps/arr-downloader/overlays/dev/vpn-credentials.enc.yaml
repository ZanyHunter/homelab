# Mullvad WireGuard credentials for Gluetun -- no Tofu counterpart exists
# for these (Mullvad doesn't originate from this repo's own generated
# state), same category as oauth2-proxy's cookie secrets, so this stays
# ksops-encrypted rather than an ExternalSecret.
#
# Per-environment (not shared in base/, unlike every other ksops secret in
# this repo) since a WireGuard private key IS a device identity to the VPN
# provider -- dev and prod each need their own Mullvad device/keypair, or
# both pods would fight over one tunnel slot. Moved here from
# apps/arr-downloader/base/ once that was found live: this repo's dev/prod
# promotion pipeline would otherwise have pushed dev's own live credentials
# straight into prod's Gluetun on the very next merge to main.
#
# Registered via a locally-generated WireGuard keypair (X25519, generated
# with Python's `cryptography` library) uploaded as a public key through
# Mullvad's account portal (My devices > Advanced > Create device) -- the
# private key below never left this machine. wireguard-addresses is the
# IPv4 Mullvad assigned to this device, shown on its own device page after
# creation.
#
# To rotate: generate a fresh keypair, upload the new public key as a new
# device on Mullvad's portal, update both values below, re-encrypt with
# `sops -e -i`, then remove the old device from Mullvad's portal.
apiVersion: v1
kind: Secret
metadata:
    name: vpn-credentials
    namespace: arr-downloader
stringData:
    wireguard-private-key: ENC[AES256_GCM,data:IhMW4U77/NrBhY+1g9Wl78siwmxce/ENqarXnn9uQWhosTM/ka6qXyI8Jg8=,iv:xwzqi5TRITWxcZnv0dwkivIGN8UbC5VaPGwyTRKQIbo=,tag:QyWRvMkD4RRSwa+3vSXNwg==,type:str]
