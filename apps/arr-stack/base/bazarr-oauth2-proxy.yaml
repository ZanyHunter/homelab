# Forward-auth for Bazarr, which has no OIDC support of its own -- same
# copy-paste template as every other app's oauth2-proxy here
# (apps/changedetection/base/oauth2-proxy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr-oauth2-proxy
  namespace: arr-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr-oauth2-proxy
  template:
    metadata:
      labels:
        app: bazarr-oauth2-proxy
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://__KEYCLOAK_HOSTNAME__/realms/homelab
            - --redirect-url=https://__BAZARR_HOSTNAME__/oauth2/callback
            - --email-domain=*
            - --cookie-secure=true
            - --scope=openid email profile
            - --set-xauthrequest=true
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
          ports:
            - containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bazarr-oauth2-proxy-credentials
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bazarr-oauth2-proxy-credentials
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bazarr-oauth2-proxy-cookie-secret
                  key: cookie-secret
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr-oauth2-proxy
  namespace: arr-stack
spec:
  selector:
    app: bazarr-oauth2-proxy
  ports:
    - port: 80
      targetPort: 4180
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr-oauth2-proxy
  namespace: arr-stack
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  rules:
    - host: __BAZARR_HOSTNAME__
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: bazarr-oauth2-proxy
                port:
                  number: 80
  tls:
    - hosts:
        - __BAZARR_HOSTNAME__
      secretName: bazarr-tls
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-oauth2-proxy-credentials
  namespace: arr-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: bazarr-oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: bazarr-oidc-client-secret
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: bazarr-oidc-client-secret
        property: client-secret
