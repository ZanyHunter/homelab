# Default-deny + only the traffic this namespace actually needs, same
# pattern as every other namespace in this repo (#31). No native OIDC on
# any of the three apps here -- gated by oauth2-proxy forward-auth instead,
# one instance per app, same shape as changedetection.io/Pinchflat.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: arr-stack
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: arr-stack
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# sonarr/radarr/prowlarr talk to each other directly (Prowlarr pushes
# indexer sync to Sonarr/Radarr's own APIs); the three oauth2-proxy
# instances need none of this, but sharing one unconditional same-namespace
# rule costs nothing, same reasoning as matrix's identical rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: arr-stack
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# ingress-nginx -> all three apps' own Ingresses and their oauth2-proxy
# instances (the "/oauth2" paths, and each one's own auth-url subrequest).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-ingress
  namespace: arr-stack
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Each oauth2-proxy's own OIDC calls (discovery/token/jwks) go to the
# *external* keycloak.<domain_name> hostname, which resolves back through
# ingress-nginx's LoadBalancer IP -- same pattern as every other app's
# oauth2-proxy here. Scoped to the oauth2-proxy pods specifically (not
# namespace-wide) since the apps behind them have no reason to reach
# ingress-nginx directly. Byparr has no Ingress/oauth2-proxy of its own
# (see byparr.yaml), so it's never in this list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-egress
  namespace: arr-stack
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["sonarr-oauth2-proxy", "radarr-oauth2-proxy", "prowlarr-oauth2-proxy", "bazarr-oauth2-proxy", "tdarr-oauth2-proxy"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Sonarr/Radarr's metadata-provider lookups (cover art/info) and Prowlarr's
# indexer queries -- same exact rule shape as Pinchflat's precedent
# (apps/youtube-archiver/base/network-policies.yaml): scoped to these pods'
# labels, not namespace-wide, and 443/TCP only since none of these apps
# ever make a raw/non-HTTPS connection the way qBittorrent's torrent
# traffic does (that traffic stays entirely inside apps/arr-downloader/,
# behind Gluetun). Bazarr's subtitle-provider lookups are the same shape --
# added here deliberately rather than to the Gluetun-proxy rule above,
# since subtitle traffic isn't "indexer/tracker traffic" under this app's
# own VPN-routing scoping (see docs/src/explanation/arr-stack.md). Tdarr
# was initially left out (only reads local media and writes its own PVCs)
# but found live to genuinely need this too -- its community plugin/flow
# marketplace (Settings > Plugins, backing the Flow editor's search) fetches
# its catalog live from GitHub, and returned an empty result set with no
# egress rule present.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-egress
  namespace: arr-stack
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["sonarr", "radarr", "prowlarr", "bazarr", "tdarr"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
---
# Cross-namespace pod-to-pod egress: Sonarr/Radarr call qBittorrent's Web
# API directly (apps/arr-downloader/) to submit and monitor downloads,
# rather than through its oauth2-proxy-gated Ingress -- second use of the
# precedent Matrix Authentication Service established (apps/matrix-mas/base/
# network-policies.yaml). Prowlarr doesn't need this -- it manages indexers,
# not download clients, in this deployment. Only one direction is needed
# (Sonarr/Radarr initiate; qBittorrent never calls back into arr-stack) --
# see apps/arr-downloader/base/network-policies.yaml's matching ingress
# rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-downloader-namespace-egress
  namespace: arr-stack
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["sonarr", "radarr"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr-downloader
      ports:
        - port: 8080
          protocol: TCP
---
# Separate rule (rather than folding into the one above) since this is a
# different purpose with a different pod set: routing specific outbound
# traffic through Gluetun's built-in HTTP proxy (port 8888, see
# apps/arr-downloader/base/gluetun-qbittorrent.yaml) so indexer/tracker
# traffic transits the VPN tunnel while these apps themselves stay outside
# the privileged namespace. Sonarr/Radarr/Prowlarr all need this (each
# configures its own outbound HTTP proxy setting to point here, with a
# bypass list for internal cluster hostnames so management/API traffic
# stays direct); Byparr will too, once added. Prowlarr deliberately isn't
# in the port-8080 rule above (it never talks to qBittorrent's API) but
# does need this one. See docs/src/explanation/arr-stack.md for why this
# has no per-purpose granularity past each app's own bypass list --
# metadata-provider lookups ride through the VPN alongside indexer traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-downloader-proxy-egress
  namespace: arr-stack
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["sonarr", "radarr", "prowlarr", "byparr"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr-downloader
      ports:
        - port: 8888
          protocol: TCP
