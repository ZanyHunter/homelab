# Radarr — https://radarr.video/. Movie PVR: watches indexers (via
# Prowlarr) for releases matching the tracked wanted list, sends matches to
# qBittorrent (apps/arr-downloader/), imports/hardlinks completed downloads
# into the library once done.
#
# hotio's image over linuxserver.io's, same reasoning as qBittorrent's own
# choice in apps/arr-downloader/base/gluetun-qbittorrent.yaml -- built to
# run as an arbitrary non-root uid directly rather than needing a root-start
# phase, which this repo's restricted-PSA namespaces force away from the
# first process. :release is hotio's own documented stable channel (they
# don't publish immutable per-version tags); re-pin if that ever changes.
#
# No OIDC of its own -- gated by oauth2-proxy forward-auth instead
# (radarr-oauth2-proxy.yaml), same template as every other app here.
# Radarr's own built-in authentication (username/password, or disabled
# entirely) is left at its default off setting -- oauth2-proxy in front of
# the whole app is the only auth layer, same "one credential set to
# remember" reasoning as every other app.
#
# Two volumes: /config (its own SQLite DB -- movie list, download
# history/state, real state) and /media (the read-write NFS tree shared
# with qBittorrent's downloads and Sonarr, media-rw-pv.yaml) -- Radarr's own
# library root points at /media/Movies, its download-client-watched folder
# at /media/Downloads, both under the identical mount every other container
# in this pipeline shares, so hardlinked imports stay on one filesystem.
# qBittorrent connection details (host qbittorrent.arr-downloader.
# svc.cluster.local, port 8080) and the /media/Downloads <-> /media path
# mapping are configured by hand in Radarr's own Settings UI after first
# boot -- no env var covers either, same "managed by hand" precedent as
# Jellyfin's SSO plugin config.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: arr-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: __STORAGE_CLASS_CEPH__
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: arr-stack
spec:
  replicas: 1
  # RWO config PVC: a rolling update would try to schedule the new pod
  # before the old one releases the volume, same reasoning as every other
  # RWO-PVC app here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
      annotations:
        backup.velero.io/backup-volumes: "config"
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radarr
          image: ghcr.io/hotio/radarr:release
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
          ports:
            - containerPort: 7878
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          persistentVolumeClaim:
            claimName: arr-media-rw
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: arr-stack
spec:
  selector:
    app: radarr
  ports:
    - port: 7878
      targetPort: 7878
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: arr-stack
  annotations:
    # No ssl-redirect/cert-manager annotations here -- radarr-oauth2-proxy's
    # own Ingress (same host) owns the actual Certificate, same as every
    # other app's oauth2-proxy pairing.
    nginx.ingress.kubernetes.io/auth-url: "http://radarr-oauth2-proxy.arr-stack.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://__RADARR_HOSTNAME__/oauth2/start?rd=$scheme://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
spec:
  ingressClassName: nginx
  rules:
    - host: __RADARR_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
  tls:
    - hosts:
        - __RADARR_HOSTNAME__
      secretName: radarr-tls
