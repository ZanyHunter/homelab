# Mirrors keycloak-realm's kubernetes_secret.changedetection_oauth2_proxy_client_secret
# (namespace keycloak-secrets) via ESO's kubernetes-provider ClusterSecretStore
# (apps/cluster-addons/base/) — automatically stays current across a
# keycloak-realm destroy/recreate or a deliberate secret rotation, no manual
# terragrunt output/hand-carry step (#42). client-id rides along even though
# it isn't actually sensitive (a static, Tofu-known string) — simpler than a
# second mechanism for one non-secret value. cookie-secret has no Tofu
# counterpart and stays ksops-encrypted (changedetection-cookie-secret.enc.yaml).
# See docs/src/explanation/gitops-app-of-apps.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changedetection-oauth2-proxy-credentials
  namespace: changedetection
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: changedetection-oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: changedetection-oidc-client-secret
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: changedetection-oidc-client-secret
        property: client-secret
