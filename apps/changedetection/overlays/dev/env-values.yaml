# The per-environment values this app's base/ manifests reference as
# __APP_HOSTNAME__/__KEYCLOAK_HOSTNAME__/__STORAGE_CLASS_CEPH__ tokens — see
# docs/src/bootstrap-environment/06-gitops.md for the base/overlays pattern.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
data:
  app-hostname: changedetection.dev.thepugh.family
  keycloak-hostname: keycloak.dev.thepugh.family
  storage-class-ceph: ceph-rbd-dev
