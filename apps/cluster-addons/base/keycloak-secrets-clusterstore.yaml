# Cluster-scoped, so any app's own ExternalSecret (apps/<app>/base/) can
# reference it regardless of namespace. Reads Secrets directly out of the
# keycloak-secrets namespace via ESO's kubernetes provider — no secret
# material lives in this object itself. See
# docs/src/bootstrap-environment/06-gitops.md.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: keycloak-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: keycloak-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: keycloak-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: keycloak-secrets-reader
          namespace: keycloak-secrets
