# RBAC scoping External Secrets Operator's kubernetes-provider ClusterSecretStore
# (keycloak-secrets-clusterstore.yaml) to read-only access on Secrets in the
# keycloak-secrets namespace only — the Tofu-owned namespace holding every real
# app's live Keycloak client secret (tofu/modules/keycloak-realm/main.tf). ESO
# mints a short-lived token for this ServiceAccount via the TokenRequest API,
# it doesn't read a static token Secret. See docs/src/explanation/gitops-app-of-apps.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-secrets-reader
  namespace: keycloak-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-secrets-reader
  namespace: keycloak-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-secrets-reader
  namespace: keycloak-secrets
subjects:
  - kind: ServiceAccount
    name: keycloak-secrets-reader
    namespace: keycloak-secrets
roleRef:
  kind: Role
  name: keycloak-secrets-reader
  apiGroup: rbac.authorization.k8s.io
