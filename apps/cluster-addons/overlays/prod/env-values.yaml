# The per-environment values this directory's base/ manifests reference as
# __LB_POOL_RANGE_1__/__LB_POOL_RANGE_2__ tokens — see
# docs/src/explanation/gitops-app-of-apps.md for the base/overlays pattern.
# Prod took over 192.168.160.0/27 (VLAN 1601, the range dev used to occupy)
# as part of the dev/prod VLAN reorg — gateway/VIP/nodes/ingress_ip occupy
# .1-.9, so these pools start past that. See tofu/live/prod/env.hcl.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
data:
  lb-pool-range-1: 192.168.160.10-192.168.160.13
  lb-pool-range-2: 192.168.160.20-192.168.160.22
