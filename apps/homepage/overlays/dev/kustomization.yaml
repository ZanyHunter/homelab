apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - env-values.yaml

replacements:
  - source:
      kind: ConfigMap
      name: env-values
      fieldPath: data.app-hostname
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Deployment
          name: homepage
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=HOMEPAGE_ALLOWED_HOSTS].value
        options:
          delimiter: ","
          index: 1
      - select:
          kind: Deployment
          name: homepage
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=HOMEPAGE_EXTERNAL_URL].value
        options:
          delimiter: "/"
          index: 2
  - source:
      kind: ConfigMap
      name: env-values
      fieldPath: data.keycloak-hostname
    targets:
      - select:
          kind: Deployment
          name: homepage
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=HOMEPAGE_OIDC_ISSUER].value
        options:
          delimiter: "/"
          index: 2
  - source:
      kind: ConfigMap
      name: env-values
      fieldPath: data.domain-suffix
    targets:
      - select:
          kind: Deployment
          name: homepage
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=HOMEPAGE_VAR_DOMAIN_SUFFIX].value
