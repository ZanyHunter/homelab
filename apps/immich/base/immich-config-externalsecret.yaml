# Mirrors keycloak-realm's kubernetes_secret.immich_oidc_client_secret
# (namespace keycloak-secrets) via ESO's kubernetes-provider ClusterSecretStore
# (apps/cluster-addons/base/) — automatically stays current across a
# keycloak-realm destroy/recreate or a deliberate secret rotation, no manual
# terragrunt output/hand-carry step (#42). This also fixes a pre-existing
# over-encryption: the old ksops file encrypted the entire immich-config.yaml
# document even though only clientSecret is actually sensitive — everything
# else here is plain, reviewable YAML. __KEYCLOAK_HOSTNAME__ is still a
# placeholder token, substituted per-environment by
# overlays/{dev,prod}/kustomization.yaml's replacements:, retargeted from the
# old plain Secret to this ExternalSecret's spec.target.template.data field.
# See docs/src/explanation/gitops-app-of-apps.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: immich-config
    template:
      engineVersion: v2
      data:
        immich-config.yaml: |
          oauth:
            enabled: true
            issuerUrl: "https://__KEYCLOAK_HOSTNAME__/realms/homelab"
            clientId: "immich"
            clientSecret: "{{ .clientSecret }}"
            scope: "openid email profile"
            autoRegister: true
            buttonText: "Login with Keycloak"
            roleClaim: "immich_role"
          passwordLogin:
            enabled: false
  data:
    - secretKey: clientSecret
      remoteRef:
        key: immich-oidc-client-secret
        property: client-secret
