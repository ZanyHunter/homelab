# Source: immich/templates/machine-learning.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/version: v3.2.0
    helm.sh/chart: immich-0.13.4
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # RollingUpdate was safe while /cache was an emptyDir; now that it's a
  # real ReadWriteOnce PVC (immich-ml-cache, issue #85), the default
  # rolling update would try to schedule the replacement pod before the
  # old one releases the volume and deadlock on a multi-attach error —
  # same reasoning as every other RWO-PVC-backed Deployment in this repo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: machine-learning
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: machine-learning
    spec:
      enableServiceLinks: false
      serviceAccountName: immich-machine-learning
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        # Same reasoning as apps/immich/base/immich.yaml's immich-server
        # sibling — skips re-walking the whole PVC on restart once
        # ownership already matches. Only became relevant once /cache
        # became a real PVC instead of an emptyDir (issue #85).
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_HOSTNAME
            value: immich-postgres
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-db-credentials
          - name: DB_USERNAME
            value: immich
          - name: HF_XET_CACHE
            value: /cache/huggingface-xet
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://immich-machine-learning:3003
          - name: MPLCONFIGDIR
            value: /cache/matplotlib-config
          - name: REDIS_HOSTNAME
            value: immich-valkey
          - name: TRANSFORMERS_CACHE
            value: /cache
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          name: main
          ports:
          - containerPort: 3003
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            # Bumped from 500m/512Mi requests, 2/3Gi limits for the
            # ViT-L-16-SigLIP-256__webli CLIP model (issue #85). Verified
            # live on dev: the combined visual+textual ONNX weights are
            # ~2.5GB on disk, and cgroup memory.current reached ~5.3GiB
            # with both towers loaded simultaneously (one real text query,
            # one real image) — the 6Gi limit tried first left under 1GB
            # of headroom, too tight for concurrent requests or a real
            # Smart Search job batch, so this went to 8Gi instead.
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
          - mountPath: /cache
            name: cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
---
# Source: immich/templates/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: server
    app.kubernetes.io/version: v3.2.0
    helm.sh/chart: immich-0.13.4
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: server
    spec:
      enableServiceLinks: false
      serviceAccountName: immich-server
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        # Default (Always) recursively chowns the entire immich-media PVC on
        # every pod start — found live during a legacy migration import: a
        # real, freshly-populated NFS-backed library took long enough that
        # the pod sat in ContainerCreating for many minutes. OnRootMismatch
        # still does that walk the first time ownership doesn't already
        # match, but skips it on every subsequent restart once it does.
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - env:
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_HOSTNAME
            value: immich-postgres
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-db-credentials
          - name: DB_USERNAME
            value: immich
          - name: IMMICH_ALLOW_SETUP
            value: "false"
          - name: IMMICH_CONFIG_FILE
            value: /config/immich-config.yaml
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://immich-machine-learning:3003
          - name: REDIS_HOSTNAME
            value: immich-valkey
          image: ghcr.io/immich-app/immich-server:v3.3.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          name: main
          ports:
          - containerPort: 2283
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
          - mountPath: /config
            name: config
          - mountPath: /data
            name: data
      volumes:
        - name: config
          secret:
            secretName: immich-config
        - name: data
          persistentVolumeClaim:
            claimName: immich-media
