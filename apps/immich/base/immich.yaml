# Pinned `helm template` render of oci://ghcr.io/immich-app/immich-charts/immich
# @ 0.13.4 (chart's own appVersion v3.2.0, image.tag overridden below to the
# actual latest app release — immich-charts doesn't track every Immich
# release, same gap already documented in the v3.0.0 -> v3.1.0 bump below)
# — committed as static output rather than rendered at sync time (Kustomize's
# helmCharts inflator has a real, currently-unresolved bug pulling OCI
# charts: kubernetes-sigs/kustomize#4381, argoproj/argo-cd#21257). Same
# "avoid third-party chart pinning risk" reasoning already used for
# Postgres/MinIO elsewhere in this repo, just applied to a whole chart
# instead of a single container.
#
# runAsUser/fsGroup: 1000 was picked (not any single image's actual UID) and
# verified live — both immich-server and immich-machine-learning's images
# run as root by default and don't ship a built-in non-root user, so any
# arbitrary non-root UID works; found live via a real "container has
# runAsNonRoot and image will run as root" failure on the first deploy
# attempt (root-squash is disabled on the NFS export, same as elsewhere in
# this repo, so the exact UID writing to the media PVC doesn't matter).
#
# IMMICH_ALLOW_SETUP=false: disables the local admin-setup wizard
# (independent of immich-config.enc.yaml's passwordLogin.enabled) — see
# docs/src/explanation/immich.md's "Local login is disabled"
# section for the two real Keycloak role-mapper gotchas this required.
# Bumped v3.0.0 -> v3.1.0: the release that ships re-evaluating the OIDC
# role claim on every login and supporting array claim values, rather than
# only at account creation with string-only values — the exact gap that
# forced the client-role/single-string workaround documented in
# 15-immich.md. Still left as-is rather than simplified back to a realm
# role: no reason to reintroduce noisy default realm roles into the claim
# just because a newer server version happens to tolerate them now.
#
# Bumped v3.1.0 -> v3.3.1 (chart 0.13.1 -> 0.13.4): a routine version-catchup
# upgrade after the dev cluster sat powered off for a while, not tied to any
# specific fix this repo needed. Checked the v3.2.0/v3.3.0/v3.3.1 release
# notes for breaking changes first (none found) and diffed both chart
# versions' templates/values.schema.json before re-rendering — the only
# template change (#411/#412 upstream) is an `unset $ctx.Values.immich
# "configuration"` guard that doesn't affect this deployment, since it only
# matters for the chart's own inline `immich.configuration` value, not the
# `existingConfiguration`/`configurationKind: Secret` path this repo uses.
#
# The values block below was itself out of date before this upgrade — it
# never got updated for issue #85's machine-learning `/cache` PVC (the
# `Recreate` strategy override, `fsGroupChangePolicy`, and the bumped
# resources it required), so a prior re-render would have silently dropped
# those. Corrected here to match what's actually committed below.
#
# To upgrade: `helm pull oci://ghcr.io/immich-app/immich-charts/immich
# --version <new> --untar`, re-render with the values below (see
# docs/src/explanation/immich.md), review the diff, replace
# this file — and if the values block below needed any one-off addition to
# produce that diff cleanly, update the block itself in the same change so
# it doesn't go stale again.
#
# helm template immich <chart> --namespace immich -f -  <<'VALUES'
# defaultPodOptions:
#   securityContext:
#     runAsNonRoot: true
#     runAsUser: 1000
#     fsGroup: 1000
#     fsGroupChangePolicy: OnRootMismatch
#     seccompProfile:
#       type: RuntimeDefault
# controllers:
#   main:
#     containers:
#       main:
#         image:
#           tag: v3.3.1
#         env:
#           DB_HOSTNAME: immich-postgres
#           DB_USERNAME: immich
#           DB_DATABASE_NAME: immich
#           DB_PASSWORD:
#             valueFrom:
#               secretKeyRef:
#                 name: immich-db-credentials
#                 key: password
#         securityContext:
#           allowPrivilegeEscalation: false
#           runAsNonRoot: true
#           capabilities:
#             drop: ["ALL"]
# immich:
#   metrics:
#     enabled: false
#   persistence:
#     library:
#       existingClaim: immich-media
#   configurationKind: Secret
#   existingConfiguration: immich-config
# valkey:
#   enabled: true
# server:
#   enabled: true
#   controllers:
#     main:
#       containers:
#         main:
#           env:
#             IMMICH_ALLOW_SETUP: "false"
#           resources:
#             requests: { cpu: 250m, memory: 512Mi }
#             limits: { memory: 2Gi }
#   ingress:
#     main:
#       enabled: true
#       className: nginx
#       annotations:
#         nginx.ingress.kubernetes.io/proxy-body-size: "0"
#         cert-manager.io/cluster-issuer: letsencrypt-prod
#         nginx.ingress.kubernetes.io/ssl-redirect: "true"
#       hosts:
#         - host: __APP_HOSTNAME__
#           paths:
#             - path: "/"
#               service: { identifier: main }
#       tls:
