# Photo/video library storage — bulk files, sequential reads, no
# locking-sensitivity, so NFS (nfs-dev) rather than the Ceph-backed
# StorageClass. See docs/src/explanation/ceph-backed-storage.md's
# rule of thumb and docs/src/explanation/immich.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-media
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: __STORAGE_CLASS_NFS__
  resources:
    requests:
      storage: 200Gi
