# Homebox (home inventory management) —
# https://github.com/sysadminsmedia/homebox, the actively-maintained fork
# (the original hay-kot/homebox was archived June 2024). Native OIDC support
# (HBOX_OIDC_*, docs: https://homebox.software/en/quick-start/configure/oidc/)
# — fully declared via env vars below, no manual web-UI step. SQLite-based,
# no separate DB.
#
# The default image runs as root; the -rootless tag runs as uid/gid 65532
# (docs' own chown example), which is what's used here for restricted PSA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: inventory
spec:
  replicas: 1
  # RWO PVC: a rolling update would try to schedule the new pod before the
  # old one releases the volume, deadlocking on a multi-attach error.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
      annotations:
        # Opts this pod's "data" volume into Velero's File System Backup —
        # actual SQLite contents, not just the Deployment's own object
        # definition. See docs/src/explanation/backup-and-restore.md.
        backup.velero.io/backup-volumes: "data"
    spec:
      # See apps/actual/actual.yaml's comment — defensive across every app
      # here, not just the one that actually collided (Actual's ACTUAL_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:0.26.2-rootless
          ports:
            - containerPort: 7745
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          env:
            - name: HBOX_MODE
              value: production
            - name: HBOX_OPTIONS_ALLOW_ANALYTICS
              value: "false"
            - name: HBOX_OPTIONS_TRUST_PROXY
              value: "true"
            - name: HBOX_OPTIONS_HOSTNAME
              value: __APP_HOSTNAME__
            # Keycloak account creation is already the real access gate for
            # this homelab (same reasoning as Immich's autoRegister) — no
            # separate local-password account should exist alongside it.
            - name: HBOX_OPTIONS_ALLOW_LOCAL_LOGIN
              value: "false"
            - name: HBOX_OIDC_ENABLED
              value: "true"
            - name: HBOX_OIDC_ISSUER_URL
              value: https://__KEYCLOAK_HOSTNAME__/realms/homelab
            - name: HBOX_OIDC_CLIENT_ID
              value: homebox
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homebox-oidc-config
                  key: oidc-client-secret
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: homebox-config
                  key: api-key-pepper
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 7745
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: 7745
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homebox-data
---
apiVersion: v1
kind: Service
metadata:
  name: homebox
  namespace: inventory
spec:
  selector:
    app: homebox
  ports:
    - port: 7745
      targetPort: 7745
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homebox
  namespace: inventory
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: __APP_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homebox
                port:
                  number: 7745
  tls:
    - hosts:
        - __APP_HOSTNAME__
      secretName: inventory-tls
