# Default-deny + only the traffic this namespace actually needs, same
# pattern as every other namespace in this repo (#31). No sidecar (unlike
# changedetection.io/Pinchflat's oauth2-proxy): the SSO plugin's OIDC calls
# originate from Jellyfin's own pod, same shape as LubeLogger/Mealie/Vikunja.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: jellyfin
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: jellyfin
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ingress-nginx -> Jellyfin's web UI/API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-ingress
  namespace: jellyfin
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# The SSO plugin's own server-side OIDC calls (discovery/token exchange) go
# to Keycloak's *external* hostname, which resolves back through
# ingress-nginx's LoadBalancer IP -- same pattern as sso-demo/LubeLogger.
# Note this only covers the plugin's traffic once installed/configured; it
# has no bearing on the static NFS media mount, which happens at the node's
# kernel/kubelet level outside the pod network namespace entirely and isn't
# subject to NetworkPolicy either way (same reason no NFS-related egress
# rule exists for Immich/Wikipedia/Pinchflat's NFS-backed PVCs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-egress
  namespace: jellyfin
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Cross-namespace pod-to-pod ingress: Seerr (apps/media-requests/) calls
# Jellyfin's API directly to import users/libraries and trigger a scan once
# a requested item's Sonarr/Radarr download finishes -- same shape as
# Sonarr/Radarr -> qBittorrent's cross-namespace rule
# (apps/arr-stack/base/network-policies.yaml), itself following the
# MAS <-> Synapse precedent. Only one direction is needed (Seerr initiates;
# Jellyfin never calls back into media-requests).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-media-requests-namespace-ingress
  namespace: jellyfin
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media-requests
      ports:
        - port: 8096
          protocol: TCP
---
# Cross-namespace pod-to-pod ingress: Sonarr/Radarr's native Jellyfin
# "Connect" notification (apps/arr-stack/base/network-policies.yaml's
# matching egress rule) pushes a library-refresh call here on every
# import/upgrade/rename/delete, so Jellyfin never serves a stale/deleted
# file between scheduled scans -- found missing live as a real "Playback
# Error" after a Sonarr quality upgrade. Only one direction is needed
# (Sonarr/Radarr initiate; Jellyfin never calls back into arr-stack).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-stack-namespace-ingress
  namespace: jellyfin
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr-stack
      ports:
        - port: 8096
          protocol: TCP
