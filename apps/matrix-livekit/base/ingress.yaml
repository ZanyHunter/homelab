# One shared hostname, path-split between the two HTTP-facing components —
# avoids sprawling into two new public hostnames for what's really one
# feature. Everything but /livekit/jwt goes to LiveKit's own WebSocket
# signaling here; the JWT path gets its own Ingress object below. Only the
# UDP media port (livekit.yaml's livekit-media Service) bypasses
# ingress-nginx entirely — signaling and JWT issuance are both ordinary
# HTTPS/WSS through it, same as every other app here. Generous proxy
# timeouts: signaling is a long-lived WebSocket connection for the
# duration of a call, not a normal short-lived HTTP request.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-livekit
  namespace: matrix-livekit
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: __APP_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-signaling
                port:
                  number: 7880
  tls:
    - hosts:
        - __APP_HOSTNAME__
      secretName: matrix-livekit-tls
---
# Split into its own Ingress object (not just a second path on the one
# above) because ingress-nginx annotations apply per-Ingress, not per-path
# — this is the only path that needs rewrite-target's prefix-stripping.
# lk-jwt-service's own Go mux registers bare routes (/sfu/get, /get_token,
# /delegate_delayed_leave, matching lk-jwt-service.yaml's real requests
# like .../livekit/jwt/sfu/get) with no /livekit/jwt prefix awareness of
# its own — its own README's example nginx config relies on the same
# trailing-slash location/proxy_pass prefix-strip trick this mirrors via
# rewrite-target. Found live: every real request here was 404ing at
# lk-jwt-service's mux (including CORS preflights, surfacing first as a
# browser CORS error since a 404 carries none of lk-jwt-service's own
# built-in CORS headers) despite #72's own original verification checking
# only that this Ingress routed to the right Service, never a real
# request/response round-trip through it. No cert-manager annotation here
# — reuses the Certificate/Secret the Ingress above already manages for
# the same host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-livekit-jwt
  namespace: matrix-livekit
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: __APP_HOSTNAME__
      http:
        paths:
          - path: /livekit/jwt(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: lk-jwt-service
                port:
                  number: 8080
  tls:
    - hosts:
        - __APP_HOSTNAME__
      secretName: matrix-livekit-tls
