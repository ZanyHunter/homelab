# Mirrors keycloak-realm's kubernetes_secret.mas_oidc_client_secret
# (namespace keycloak-secrets) via ESO's kubernetes-provider
# ClusterSecretStore, same pattern every other app's OIDC client secret uses
# in this repo (#42) — see apps/matrix/base/synapse-secrets-externalsecret.yaml
# for the original version of this exact pattern, which this mirrors almost
# field for field. MAS becomes the actual OAuth2 Relying Party talking to
# Keycloak now (#74) — Synapse no longer holds any Keycloak client
# credentials of its own at all.
#
# claims_imports follows MAS's own documented Keycloak sample exactly
# (action: require on localpart, matching the same preferred_username claim
# Synapse's old user_mapping_provider used) so a fresh MAS-provisioned
# account keys off the identical localpart the old Synapse-native OIDC flow
# already used.
#
# token_endpoint_auth_method is client_secret_basic here, not
# client_secret_post like the old Synapse client used — MAS's own Keycloak
# sample configuration recommends this explicitly for Keycloak specifically.
#
# __KEYCLOAK_HOSTNAME__ is substituted the same delimiter/index way as
# synapse-secrets-externalsecret.yaml's own copy of this exact issuer line
# (it's the first "/"-bearing text in this whole document, so index 2
# isolates it regardless of what follows) — deliberately zero "/" characters
# above this point in the file, same discipline as every other app's
# comments here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mas-oidc-secret
  namespace: matrix-mas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: mas-oidc-secret
    template:
      engineVersion: v2
      data:
        upstream-oauth2.yaml: |
          upstream_oauth2:
            providers:
              - id: "01M1G9KN6N45DQKTCZ059X2VXS"
                human_name: "Keycloak"
                issuer: "https://__KEYCLOAK_HOSTNAME__/realms/homelab"
                token_endpoint_auth_method: client_secret_basic
                client_id: "mas"
                client_secret: "{{ .clientSecret }}"
                scope: "openid profile email"
                claims_imports:
                  localpart:
                    action: require
                    template: "{{ "{{" }} user.preferred_username {{ "}}" }}"
                  displayname:
                    action: suggest
                    template: "{{ "{{" }} user.name {{ "}}" }}"
                  email:
                    action: suggest
                    template: "{{ "{{" }} user.email {{ "}}" }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: mas-oidc-client-secret
        property: client-secret
