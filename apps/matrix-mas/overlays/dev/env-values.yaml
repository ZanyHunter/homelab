# The per-environment values this app's base/ manifests reference as
# __APP_HOSTNAME__/__DOMAIN_NAME__/__KEYCLOAK_HOSTNAME__/__STORAGE_CLASS_CEPH__
# tokens — see docs/src/explanation/gitops-app-of-apps.md for the
# base/overlays pattern. domain-name must equal apps/matrix/overlays/dev/'s
# own domain-name exactly (Synapse's server_name) — MAS identifies which
# homeserver it's paired with by this value, not by connecting to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
data:
  app-hostname: matrix-auth.dev.thepugh.family
  domain-name: dev.thepugh.family
  keycloak-hostname: keycloak.dev.thepugh.family
  storage-class-ceph: ceph-rbd-dev
