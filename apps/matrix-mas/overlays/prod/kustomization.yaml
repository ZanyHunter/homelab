apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - env-values.yaml

replacements:
  - source:
      kind: ConfigMap
      name: env-values
      fieldPath: data.app-hostname
    targets:
      - select:
          kind: Ingress
          name: mas
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: ConfigMap
          name: mas-config
        fieldPaths:
          - data.public-base\.yaml
        options:
          delimiter: "/"
          index: 2
  - source:
      kind: ConfigMap
      name: env-values
      fieldPath: data.domain-name
    targets:
      - select:
          kind: ConfigMap
          name: mas-config
        fieldPaths:
          - data.matrix\.yaml
        options:
          delimiter: '"'
          index: 1
  - source:
      kind: ConfigMap
      name: env-values
      fieldPath: data.keycloak-hostname
    targets:
      - select:
          kind: ExternalSecret
          name: mas-oidc-secret
        fieldPaths:
          - spec.target.template.data.upstream-oauth2\.yaml
        options:
          delimiter: "/"
          index: 2
  - source:
      kind: ConfigMap
      name: env-values
      fieldPath: data.storage-class-ceph
    targets:
      - select:
          kind: StatefulSet
          name: mas-postgres
        fieldPaths:
          - spec.volumeClaimTemplates.0.spec.storageClassName
