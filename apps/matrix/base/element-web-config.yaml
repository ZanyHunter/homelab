# Element Web's own config.json, mounted over the image's default. No
# default_hs_url/default_is_url needed: default_server_name alone lets
# Element Web discover the actual API endpoint via
# /.well-known/matrix/client at the bare apex — the same discovery flow any
# other Matrix client needs for this repo's apex-based identity (see
# matrix-wellknown.yaml, docs/src/explanation/matrix.md). __DOMAIN_NAME__ is
# the very first quoted value in this document (index 3 counting both the
# key's and value's opening/closing quotes) so overlays/{dev,prod}/'s
# delimiter/index replacement stays correct regardless of what's added
# below it later — new keys go after it for exactly that reason (#72).
#
# disable_custom_urls (public-exposure prep): removes the login screen's
# "Edit" server-picker link entirely, so this client can only ever log into
# default_server_name above -- no way to point it at a different
# homeserver. Not a security boundary on its own (Synapse's auth is already
# fully delegated to MAS/Keycloak, so nobody can authenticate here without
# valid Keycloak credentials regardless) -- this closes the separate
# concern of a future public Element Web being usable as a generic client
# against other people's servers.
#
# element_call.use_exclusively (#72), added after a real live gotcha: without
# it, Element Web's plain call/video button still defaults to legacy 1:1
# call signaling for simple calls (only explicitly-started "Element Call"
# sessions used the MatrixRTC/LiveKit path this repo actually built) —
# Element X has no legacy call support at all and surfaces "Unsupported
# call. Ask if the caller can use the new Element X app." when it receives
# one. This forces Element Web to use MatrixRTC/Element Call for every call,
# matching the only calling stack this repo actually has. Needs no
# element_call.url — that field is only for linking to a separate, external
# Element Call web app; this repo's embedded/native MatrixRTC calling
# (Synapse's own matrix_rtc.transports) doesn't use it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-config
  namespace: matrix
data:
  config.json: |
    {
      "default_server_name": "__DOMAIN_NAME__",
      "brand": "Element",
      "disable_guests": true,
      "disable_custom_urls": true,
      "show_labs_settings": false,
      "element_call": {
        "use_exclusively": true
      }
    }
