# live Postgres password). Same value as
# apps/matrix-mas/base/mas-secrets.enc.yaml's own shared-secret key — MAS's
# docs are explicit this secret must match exactly on both sides, the
# authentication mechanism for MAS's calls to Synapse's admin API and
# Synapse's calls to MAS's token-introspection endpoint. Mounted at
# secret_path in synapse-config.yaml's matrix_authentication_service block.
