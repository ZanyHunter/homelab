# Serves /.well-known/matrix/client at the bare apex hostname (#57) — the
# first thing this repo hosts at domain_name itself rather than a
# subdomain, required by Matrix's apex-based server_name identity so any
# client just given "thepugh.family"/"dev.thepugh.family" can discover the
# real API endpoint (matrix.<domain_name>). nginxinc/nginx-unprivileged
# rather than plain nginx:alpine specifically so this runs non-root on 8080
# with no arbitrary-uid workaround needed — the image is purpose-built for
# exactly this.
#
# Also serves /.well-known/matrix/server (real-time calling debugging
# follow-up to #72/#74) — originally assumed to have no functional purpose
# with federation off (federation_domain_whitelist: [] in
# synapse-config.yaml) and deliberately left unserved for that reason; that
# assumption turned out to be wrong. lk-jwt-service validates a calling
# user by presenting a Matrix native OpenID token to
# /_matrix/federation/v1/openid/userinfo, which it locates via the exact
# same server-name resolution algorithm real inter-server federation uses
# (this well-known file, then DNS SRV, then a direct :8448 connection) --
# confirmed live as a real "no route to host" on :8448 once every other
# candidate cause (routing, CORS, the openid resource itself) had been
# ruled out. Serving this file does not reopen real federation: Synapse's
# own listener only registers the client and openid resources (see
# synapse-config.yaml), so every actual federation servlet (send,
# make_join, invite, ...) still 404s regardless of who discovers this
# server via the file, and federation_domain_whitelist remains the
# authoritative off switch for anything that isn't openid/userinfo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-wellknown
  namespace: matrix
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        alias /www/matrix-client.json;
      }

      location = /.well-known/matrix/server {
        default_type application/json;
        alias /www/matrix-server.json;
      }

      location / {
        return 404;
      }
    }
  # __APP_HOSTNAME__ (index 2) and __MATRIX_CALLS_HOSTNAME__ (index 5) are
  # the only "/"-bearing text in this document, same delimiter/index
  # mechanism as every other app's overlay here — __APP_HOSTNAME__ is the
  # actual Synapse subdomain clients get redirected to, not the bare apex
  # this file itself is served from. Each token is immediately followed by
  # its own trailing "/", deliberate not stylistic: Kustomize's replacement
  # swaps the *whole* delimited segment, so without a terminating "/" the
  # token's replacement value would swallow the rest of the string with it
  # — found live via a real test build that truncated this exact file
  # before __APP_HOSTNAME__'s trailing slash was added.
  #
  # org.matrix.msc4143.rtc_foci (added for real-time calling, #72/#74's
  # calling-debugging follow-up): Element Call running as an embedded
  # widget (this repo's only deployment shape) can't use the backend
  # rtc/transports API at all — its own client has no direct access token
  # in widget mode, and RtcTransportAutoDiscovery.tryBackendTransports()
  # deliberately skips the call rather than attempt it, a documented
  # upstream matrix-js-sdk gap (github.com/matrix-org/matrix-js-sdk/issues/5245),
  # confirmed live via a real browser session where the direct endpoint
  # call succeeded by hand but the widget still reported no transport.
  # Element Call's own self_hosting.md recommends this exact well-known key
  # as the primary discovery mechanism (not just a fallback for the widget
  # gap above) — found live as a real MISSING_MATRIX_RTC_TRANSPORT error
  # even after confirming Synapse's own matrix_rtc.transports config and
  # the rtc/transports endpoint were both already correct.
  matrix-client.json: |
    {"m.homeserver": {"base_url": "https://__APP_HOSTNAME__/"}, "org.matrix.msc4143.rtc_foci": [{"type": "livekit", "livekit_service_url": "https://__MATRIX_CALLS_HOSTNAME__/livekit/jwt"}]}
  # __APP_HOSTNAME_WITH_PORT__ is a whole-field quote-delimited token (index
  # 3, same shape as __DOMAIN_NAME__ elsewhere in this app), not the
  # delimiter/index-on-a-larger-string trick used above — m.server's value
  # is "host:port" with no natural second occurrence of any single
  # character on both sides of just the hostname, so the port is baked into
  # this key's own source value (env-values.yaml) instead of being
  # reconstructed here. Must match app-hostname with ":443" appended, kept
  # in sync by hand same as matrix-calls-hostname already is against
  # apps/matrix-livekit/'s own app-hostname. The port is mandatory, not
  # decorative: per the server-server spec, an m.server value with no
  # explicit port falls back to :8448 after well-known/SRV, which nothing
  # in this repo listens on -- only :443 through ingress-nginx actually
  # reaches Synapse.
  matrix-server.json: |
    {"m.server": "__APP_HOSTNAME_WITH_PORT__"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-wellknown
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-wellknown
  template:
    metadata:
      labels:
        app: matrix-wellknown
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: config
              mountPath: /www/matrix-client.json
              subPath: matrix-client.json
              readOnly: true
            - name: config
              mountPath: /www/matrix-server.json
              subPath: matrix-server.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /.well-known/matrix/client
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: matrix-wellknown
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-wellknown
  namespace: matrix
spec:
  selector:
    app: matrix-wellknown
  ports:
    - port: 8080
      targetPort: 8080
---
# Bound to the bare domain_name itself, not a subdomain — see the comment
# at the top of this file. Reachable on LAN/VPN in both environments;
# publicly reachable only in prod, gated by core-addons'
# public_matrix_wellknown (env.hcl) — structurally never satisfiable for
# dev, whose domain_name isn't the real apex. See
# docs/src/explanation/matrix.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-wellknown
  namespace: matrix
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: __DOMAIN_NAME__
      http:
        paths:
          # ImplementationSpecific, not Prefix: ingress-nginx >=4.12's
          # stricter path validation warns/rejects a literal "." in a
          # Prefix-typed path (the "." in ".well-known") — found live via a
          # real "path /.well-known/matrix cannot be used with pathType
          # Prefix" warning on the first apply. ingress-nginx's own
          # ImplementationSpecific behavior for a plain path with no regex
          # metacharacters is a normal prefix match, so this changes no
          # actual routing behavior.
          - path: /.well-known/matrix
            pathType: ImplementationSpecific
            backend:
              service:
                name: matrix-wellknown
                port:
                  number: 8080
  tls:
    - hosts:
        - __DOMAIN_NAME__
      secretName: matrix-wellknown-tls
