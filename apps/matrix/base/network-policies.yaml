# Default-deny + only the traffic this namespace actually needs, same
# pattern as every other namespace in this repo (#31).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# synapse <-> matrix-postgres. element-web and the .well-known static
# server need no same-namespace traffic of their own (element-web is a
# pure client-side SPA; matrix-wellknown serves static files) but sharing
# this unconditional same-namespace rule costs nothing, same reasoning as
# every other multi-pod app namespace here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-ingress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Pre-#74 this covered Synapse's own direct OIDC calls to Keycloak's
# external hostname; as of #74 auth is delegated to apps/matrix-mas/
# entirely (matrix_authentication_service, see synapse-config.yaml), so
# Synapse itself no longer talks to Keycloak. Retained defensively rather
# than removed — no other app's egress rule set has been trimmed on a "no
# longer strictly needed" basis either, and this is still a tightly-scoped
# explicit allow within the same default-deny posture, not a broad opening.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-egress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# The genuinely new shape of rule #74 needs: Synapse and MAS call each other
# directly, pod-to-pod, cross-namespace, for the matrix_authentication_service
# relationship — MAS calling Synapse's admin API to provision users
# (ingress here) and Synapse calling MAS's token introspection endpoint
# (egress here). The compat-proxy paths on this namespace's own synapse.yaml
# Ingress reach MAS a different way (through ingress-nginx, via an
# ExternalName Service) and need no rule here — that path is covered by
# ingress-nginx reaching MAS's own namespace, not this one. Mirrored by the
# equivalent rules in apps/matrix-mas/base/network-policies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-matrix-mas-namespace-ingress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix-mas
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-matrix-mas-namespace-egress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix-mas
