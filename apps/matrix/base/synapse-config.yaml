# The static majority of homeserver.yaml — everything that isn't secret and
# isn't merged from another file. Synapse's own database/oidc_providers keys
# are deliberately absent here entirely (not even a placeholder) rather than
# split field-by-field across files: Synapse's docs don't document whether
# multiple `-c`/--config-path files deep-merge list/dict values or simply
# let the last file's top-level key win, so every key that needs a secret
# value lives as one complete, self-contained block in exactly one file (see
# synapse-secrets-externalsecret.yaml's oidc_providers and
# matrix-secrets.enc.yaml's database) — avoiding any dependency on merge
# semantics that aren't actually verified. See docs/src/explanation/matrix.md.
#
# Three tokens get substituted into this same multi-line blob by
# overlays/{dev,prod}/kustomization.yaml's replacements: — __DOMAIN_NAME__
# (server_name, Matrix's apex-based identity — see matrix.md),
# __APP_HOSTNAME__ (public_baseurl, the actual subdomain Synapse runs on),
# and __MATRIX_CALLS_HOSTNAME__ (matrix_rtc's livekit_service_url, #72 —
# apps/matrix-livekit/'s own public hostname). All three use Kustomize's
# delimiter/index trick (splitting the whole blob on a character and
# touching one indexed segment) rather than a full-field replacement, same
# mechanism Immich's/Vikunja's overlays already use to reach a token nested
# inside a larger text value — chosen so each token is provably isolated
# (server_name is the file's very first line, quote-delimited;
# public_baseurl's and livekit_service_url's hostnames each sit right after
# their own "https://", with livekit_service_url placed immediately after
# public_baseurl specifically so its own "/" count is easy to verify by
# hand) regardless of what any substitution's own value looks like or what
# order they run in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: matrix
data:
  homeserver.yaml: |
    server_name: "__DOMAIN_NAME__"
    public_baseurl: "https://__APP_HOSTNAME__/"

    # Real-time calling (#72) — msc3266 (room summary API, needed for
    # Element Call to join over federation via knocking), msc4143
    # (MatrixRTC transports), msc4222 (syncv2 state_after, so clients track
    # room state correctly). livekit_service_url points at the
    # matrix-livekit app's own lk-jwt-service, path-matched to that app's
    # own Ingress (see docs explanation matrix.md, real-time calling
    # section). Deliberately zero forward-slash characters in this comment
    # block, unlike most others in this file: every such character in this
    # whole ConfigMap value counts toward the delimiter-index replacements
    # below, comments included, found live as a real substitution landing
    # inside this very comment instead of the intended token.
    experimental_features:
      msc3266_enabled: true
      msc4143_enabled: true
      msc4222_enabled: true
      # QR code login (#74) -- requires matrix_authentication_service to be
      # enabled below; enabling this alone on plain Synapse crash-loops with
      # "MSC4108 requires matrix_authentication_service to be enabled",
      # confirmed live against this repo's pinned Synapse version before the
      # rest of #74's work landed. Added last in that same incident, after
      # matrix_authentication_service was already live and confirmed
      # working -- not the first thing enabled.
      msc4108_enabled: true

    matrix_rtc:
      transports:
        - type: livekit
          livekit_service_url: "https://__MATRIX_CALLS_HOSTNAME__/livekit/jwt"

    pid_file: /tmp/homeserver.pid
    log_config: /config/log_config.yaml

    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client]
            compress: false

    media_store_path: /media_store
    max_upload_size: 50M

    signing_key_path: /data/signing.key
    suppress_key_server_warning: true

    # The actual, authoritative federation-off control (#57) — not just
    # omitting the /.well-known/matrix/server file, which this repo
    # deliberately doesn't serve at all while federation stays off (no
    # functional purpose with an empty whitelist, and one fewer templated
    # token to get wrong — see matrix.md).
    federation_domain_whitelist: []

    # OIDC auto-provisions new accounts on first successful Keycloak login
    # regardless of this setting (confirmed via research, not assumed) —
    # this only blocks Synapse's own native password/email signup flow,
    # matching this repo's "any Keycloak-authorized identity gets in" model
    # everywhere else. See matrix.md.
    enable_registration: false

    # Deliberately absent (#57): no retention: block means Synapse never
    # purges messages/media — the user's explicit choice, matching how this
    # repo treats Immich's photos/Paperless's documents as real, non-
    # disposable personal data.

    report_stats: false

    # Delegated auth to Matrix Authentication Service (#74) -- replaces
    # oidc_providers entirely (apps/matrix/base/synapse-secrets-externalsecret.yaml
    # is removed as of #74; MAS is now the only thing that talks to
    # Keycloak). endpoint is an internal cluster-DNS address, not a public
    # hostname, so it needs no per-environment token -- both dev and prod
    # use the identical value, matching apps/matrix-mas/'s own namespace/
    # Service names in both environments. secret_path is the one value that
    # must match apps/matrix-mas/base/mas-config.yaml's own matrix.secret_file
    # exactly; kept in its own single-purpose ksops secret
    # (mas-shared-secret.enc.yaml) rather than folded into matrix-secrets.enc.yaml,
    # deliberately additive-only to that file's other already-live values.
    # Placed at the very end of this document specifically so it introduces
    # no "/" characters before any of the delimiter/index-targeted tokens
    # earlier in this same file (public_baseurl, server_name,
    # matrix_rtc's livekit_service_url) -- see this file's own top-of-file
    # comment for why that ordering matters.
    matrix_authentication_service:
      enabled: true
      endpoint: http://mas.matrix-mas.svc.cluster.local:8080/
      secret_path: /secrets/mas/shared-secret
  log_config.yaml: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: INFO
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false
