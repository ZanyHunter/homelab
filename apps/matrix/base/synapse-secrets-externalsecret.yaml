# Mirrors keycloak-realm's kubernetes_secret.matrix_oidc_client_secret
# (namespace keycloak-secrets) via ESO's kubernetes-provider ClusterSecretStore
# (apps/cluster-addons/base/) — automatically stays current across a
# keycloak-realm destroy/recreate or a deliberate secret rotation, same
# pattern as every other app's OIDC client secret here (#42). Renders the
# *entire* oidc_providers block, not just the client_secret field, and gets
# merged into Synapse's config via a second -c path (synapse.yaml) — kept
# whole rather than split against synapse-config.yaml's own config for the
# same undocumented-merge-semantics reason explained there.
#
# __KEYCLOAK_HOSTNAME__ substituted the same delimiter/index way as every
# other app's issuer URL here (see synapse-config.yaml's comment) — it's the
# first "/"-bearing text in this block, so index 2 isolates it regardless of
# what follows.
#
# localpart_template/display_name_template are Synapse's own Jinja2
# templates, evaluated by Synapse at login time — their {{ }} markers are
# escaped as {{ "{{" }}/{{ "}}" }} so ESO's *own* Go-template rendering pass
# (which also scans this whole block for {{ }}) emits them as literal text
# instead of trying to evaluate `user.preferred_username` as one of its own
# fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-oidc-secret
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: synapse-oidc-secret
    template:
      engineVersion: v2
      data:
        oidc.yaml: |
          oidc_providers:
            - idp_id: keycloak
              idp_name: "Keycloak"
              issuer: "https://__KEYCLOAK_HOSTNAME__/realms/homelab"
              client_id: "matrix"
              client_secret: "{{ .clientSecret }}"
              scopes: ["openid", "profile", "email"]
              backchannel_logout_enabled: true
              user_mapping_provider:
                config:
                  subject_claim: "sub"
                  localpart_template: "{{ "{{" }} user.preferred_username {{ "}}" }}"
                  display_name_template: "{{ "{{" }} user.name {{ "}}" }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: matrix-oidc-client-secret
        property: client-secret
