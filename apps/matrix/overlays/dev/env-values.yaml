# The per-environment values this app's base/ manifests reference as
# __APP_HOSTNAME__/__ELEMENT_HOSTNAME__/__DOMAIN_NAME__/
# __MATRIX_CALLS_HOSTNAME__/__STORAGE_CLASS_CEPH__/__STORAGE_CLASS_NFS__
# tokens — see docs/src/explanation/gitops-app-of-apps.md for the
# base/overlays pattern. domain-name is the bare apex (Matrix's server_name
# identity, #57) — never the same value as app-hostname, unlike every other
# app here. matrix-calls-hostname must match
# apps/matrix-livekit/overlays/<env>/env-values.yaml's own app-hostname
# exactly (#72) — two independently-set values kept in sync by hand, same
# as every other cross-app hostname reference in this repo.
# keycloak-hostname was removed here in #74 — Synapse no longer talks to
# Keycloak directly at all, only apps/matrix-mas/ does now (mas-compat-service.yaml's
# ExternalName routes the three MAS compat-proxy paths there by cluster-DNS
# name, needing no hostname token at all).
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
data:
  app-hostname: matrix.dev.thepugh.family
  element-hostname: element.dev.thepugh.family
  domain-name: dev.thepugh.family
  matrix-calls-hostname: matrix-calls.dev.thepugh.family
  storage-class-ceph: ceph-rbd-dev
  storage-class-nfs: nfs-dev
