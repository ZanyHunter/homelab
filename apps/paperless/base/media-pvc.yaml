# Document storage (originals, thumbnails, search index, consume-folder
# drop point) — bulk files, no locking-sensitivity like the database has, so
# NFS (nfs-dev) rather than the Ceph-backed StorageClass. Same split as
# Immich's media-vs-database reasoning
# (docs/src/bootstrap-environment/13-ceph-storage.md,
# docs/src/bootstrap-environment/15-immich.md). One PVC, three subPath
# mounts (data/media/consume) — simpler than three separate PVCs for one
# single-replica webserver.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: __STORAGE_CLASS_NFS__
  resources:
    requests:
      storage: 100Gi
