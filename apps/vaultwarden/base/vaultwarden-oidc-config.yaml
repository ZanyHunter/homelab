# Mirrors keycloak-realm's kubernetes_secret.vaultwarden_oidc_client_secret
# (namespace keycloak-secrets) via ESO's kubernetes-provider ClusterSecretStore
# (apps/cluster-addons/base/) — automatically stays current across a
# keycloak-realm destroy/recreate or a deliberate secret rotation, no manual
# terragrunt output/hand-carry step (#42). vaultwarden-config.enc.yaml stays
# ksops-encrypted for admin-token, which has no Tofu counterpart. See
# docs/src/explanation/gitops-app-of-apps.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-oidc-config
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-secrets
    kind: ClusterSecretStore
  target:
    name: vaultwarden-oidc-config
  data:
    - secretKey: sso-client-secret
      remoteRef:
        key: vaultwarden-oidc-client-secret
        property: client-secret
