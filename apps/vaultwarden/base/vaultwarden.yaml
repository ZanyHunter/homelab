# Vaultwarden — https://github.com/dani-garcia/vaultwarden. SQLite-based,
# no separate DB. SSO (stable since 1.35.0, docs:
# https://github.com/dani-garcia/vaultwarden/wiki/Enabling-SSO-support-using-OpenId-Connect)
# only gates *account* login — vault items are still encrypted client-side
# with a separate master password the IdP never sees, so SSO_ONLY below
# doesn't remove the master-password step, just the local-account-password
# login path.
#
# The image has no built-in non-root user (no USER/useradd in
# docker/Dockerfile.debian on main) and Ceph RBD volumes are root-owned
# until fsGroup chowns them on mount — runAsUser/fsGroup: 1000 is an
# arbitrary but consistent choice, same pattern as changedetection.io below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  # RWO PVC: a rolling update would try to schedule the new pod before the
  # old one releases the volume, deadlocking on a multi-attach error.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
      annotations:
        # Opts this pod's "data" volume into Velero's File System Backup —
        # actual SQLite contents, not just the Deployment's own object
        # definition. See docs/src/explanation/backup-and-restore.md.
        backup.velero.io/backup-volumes: "data"
    spec:
      # See apps/actual/actual.yaml's comment — defensive across every app
      # here, not just the one that actually collided (Actual's ACTUAL_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.2
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          env:
            - name: DOMAIN
              value: https://__APP_HOSTNAME__
            - name: SSO_ENABLED
              value: "true"
            # Keycloak account creation is already the real access gate for
            # this homelab (same reasoning as Immich's autoRegister) — no
            # separate local-password account should exist alongside it.
            - name: SSO_ONLY
              value: "true"
            - name: SSO_AUTHORITY
              value: https://__KEYCLOAK_HOSTNAME__/realms/homelab
            - name: SSO_CLIENT_ID
              value: vaultwarden
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc-config
                  key: sso-client-secret
            - name: SSO_SCOPES
              value: "openid email profile"
            # Needed so a real Keycloak account's first SSO login can
            # actually create a Vaultwarden account — worth tightening
            # (e.g. an invite-only flow) once every real household account
            # has logged in once; verify live before assuming this is
            # final.
            - name: SIGNUPS_ALLOWED
              value: "true"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-config
                  key: admin-token
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: __APP_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
  tls:
    - hosts:
        - __APP_HOSTNAME__
      secretName: vaultwarden-tls
