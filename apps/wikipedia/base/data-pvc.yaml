# Single NFS-backed PVC holding every ZIM file plus kiwix-serve's
# library.xml -- no Ceph-backed component at all (#53), the first app in
# this repo's apps/ tree with no database. Content is a re-fetchable cache
# (trivially re-downloadable from download.kiwix.org), not source-of-truth
# data, so unlike every other app here it gets no Velero File System Backup
# annotation -- there's no Ceph-backed volume to annotate in the first
# place, and re-downloading is strictly simpler than restoring from backup.
#
# Sizing varies per environment (env-values.yaml's pvc-size), same as the
# series each environment's updater-cronjob.yaml patch keeps -- prod
# carries the full ~162GB bundle (Wikipedia Maxi, Wiktionary nopic,
# Wikibooks/Wikiquote/Wikivoyage/Wikisource Maxi, sizes verified against
# download.kiwix.org's real metalink metadata) at 320Gi (the updater
# downloads each series' new release fully before deleting the old one,
# so during a Wikipedia Maxi update specifically -- the largest series,
# ~124GB -- old and new briefly coexist, pushing peak usage to ~286GB;
# 320Gi leaves headroom above that for future release growth too). Dev
# carries only Wikiquote + Wikivoyage (~2GB) long-term, at 5Gi.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wikipedia-data
  namespace: wikipedia
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: __STORAGE_CLASS_NFS__
  resources:
    requests:
      storage: __DATA_PVC_SIZE__
