# Periodically checks download.kiwix.org for newer dated releases and
# rebuilds library.xml when anything changes (#53's optional follow-up,
# promoted to required for this app). Alternates a sync-one/reindex pair
# per tracked series (rather than one big download pass followed by a
# single reindex at the end) so each series becomes searchable as soon as
# its own download finishes -- found live that a single reindex-at-the-end
# design left two already-fully-downloaded series (Wikiquote, Wikivoyage)
# unindexed and unsearchable for the entire multi-hour run while the
# ~124GB Wikipedia Maxi file was still in flight.
#
# All twelve sync/reindex steps are initContainers, plus one trivial
# no-op main container (Kubernetes Jobs require at least one) -- this
# base lists every tracked series; overlays/<env>/kustomization.yaml
# removes the pairs an environment doesn't want to carry (dev, e.g.,
# tracks only Wikiquote/Wikivoyage long-term -- prod carries the full
# bundle). Keeping the "real" work entirely in initContainers, with a
# fixed, always-present main container, means every environment can
# subtract series via a plain Kustomize patch without also having to
# pick a different "last" series to promote into containers: each time.
#
# Only the sync-one steps (curlimages/curl) carry real internet egress to
# kiwix's mirror network; the always-on kiwix-serve Deployment never gets
# outbound internet access at all (see network-policies.yaml).
#
# Monthly: comfortably ahead of every tracked series' observed release
# cadence (Wikipedia Maxi every ~6 months; Wiktionary/Wikibooks/Wikiquote/
# Wikisource every ~1-3 months, per download.kiwix.org's own dated
# filenames at onboarding time) without checking so often that most runs
# do nothing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-updater
  namespace: wikipedia
spec:
  schedule: "0 6 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: wikipedia-updater
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          # /data is a setgid directory owned by group 1001 (drwxrwsr-x --
          # set by the Deployment's own fsGroup: 1001, the first pod to
          # touch this PVC): sync-one runs as curl_user (uid 100/gid 101,
          # the curlimages/curl image's own non-root default), so without
          # fsGroup here too it has no write access at all -- verified live
          # as a real EACCES on every download.
          securityContext:
            fsGroup: 1001
            # Same reasoning as apps/immich/base/immich.yaml — skips
            # re-walking the whole PVC (up to ~320Gi in prod) on every
            # monthly run once ownership already matches.
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - &sync
              name: sync-wikiquote
              image: curlimages/curl:8.11.1
              command: ["sh", "/scripts/sync-one.sh", "wikiquote", "wikiquote_en_all_maxi"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 101
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
            - &reindex
              name: reindex-wikiquote
              image: ghcr.io/kiwix/kiwix-tools:3.8.2
              command: ["sh", "/scripts/reindex.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1001
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
            - <<: *sync
              name: sync-wikivoyage
              command: ["sh", "/scripts/sync-one.sh", "wikivoyage", "wikivoyage_en_all_maxi"]
            - <<: *reindex
              name: reindex-wikivoyage
            - <<: *sync
              name: sync-wikibooks
              command: ["sh", "/scripts/sync-one.sh", "wikibooks", "wikibooks_en_all_maxi"]
            - <<: *reindex
              name: reindex-wikibooks
            - <<: *sync
              name: sync-wiktionary
              command: ["sh", "/scripts/sync-one.sh", "wiktionary", "wiktionary_en_all_nopic"]
            - <<: *reindex
              name: reindex-wiktionary
            - <<: *sync
              name: sync-wikisource
              command: ["sh", "/scripts/sync-one.sh", "wikisource", "wikisource_en_all_maxi"]
            - <<: *reindex
              name: reindex-wikisource
            - <<: *sync
              name: sync-wikipedia
              command: ["sh", "/scripts/sync-one.sh", "wikipedia", "wikipedia_en_all_maxi"]
            - <<: *reindex
              name: reindex-wikipedia
          containers:
            - name: done
              image: curlimages/curl:8.11.1
              command: ["true"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 101
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: wikipedia-data
            - name: scripts
              configMap:
                name: wikipedia-updater-scripts
                defaultMode: 0555
