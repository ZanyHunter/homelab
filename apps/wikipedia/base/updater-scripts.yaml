# The two scripts behind the update mechanism. updater-cronjob.yaml (and
# kiwix.yaml's Deployment, for reindex.sh only) alternates sync-one.sh and
# reindex.sh per series -- one download-then-reindex pair per tracked
# series, not one big download pass followed by a single reindex at the
# end. Found live: with a single reindex-at-the-end design, two series
# that had already finished downloading (Wikiquote, Wikivoyage) sat
# unindexed on the PVC for the entire multi-hour run while the ~124GB
# Wikipedia Maxi file was still downloading -- kiwix-serve's search
# returned "No result" for content that was, in fact, already sitting
# right there. Reindexing after each series fixes that: content becomes
# searchable within seconds of its own download finishing, independent of
# how long any other series takes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wikipedia-updater-scripts
  namespace: wikipedia
data:
  # Downloads one series (args: $1=category $2=prefix) if download.kiwix.org
  # has a newer dated release than what's already on the PVC. Never exits
  # non-zero: a failure on one series (a transient network blip on the
  # ~124GB Wikipedia Maxi file, say) must not stop reindex.sh from running
  # afterwards for the series that *did* succeed, and must not stop the
  # next series' own sync-one/reindex pair from running either. A
  # failed/incomplete series is simply retried on the next scheduled run --
  # self-healing by design, matching this app's re-fetchable-cache framing
  # (no backups needed).
  sync-one.sh: |
    #!/bin/sh
    # No `set -e`: see the no-exit-nonzero note above.

    category="$1"
    prefix="$2"

    listing=$(curl -fsSL "https://download.kiwix.org/zim/${category}/") || {
      echo "ERROR: could not list ${category}" >&2
      exit 0
    }
    latest=$(printf '%s\n' "$listing" | grep -oE "${prefix}_[0-9]{4}-[0-9]{2}\.zim" | sort -u | tail -n1)

    if [ -z "$latest" ]; then
      echo "WARN: no ${prefix} release found in ${category} listing, skipping" >&2
      exit 0
    fi

    if [ -f "/data/${latest}" ]; then
      echo "OK: ${latest} already up to date"
      exit 0
    fi

    echo "Downloading ${latest}..."
    meta_size=$(curl -fsSL "https://download.kiwix.org/zim/${category}/${latest}.meta4" 2>/dev/null \
      | grep -oE '<size>[0-9]+</size>' | head -n1 | grep -oE '[0-9]+')

    tmp="/data/.tmp-${latest}"
    rm -f "$tmp"
    if ! curl -fL --retry 3 -o "$tmp" "https://download.kiwix.org/zim/${category}/${latest}"; then
      echo "ERROR: download failed for ${latest}" >&2
      rm -f "$tmp"
      exit 0
    fi

    actual_size=$(wc -c < "$tmp")
    if [ -n "$meta_size" ] && [ "$actual_size" != "$meta_size" ]; then
      echo "ERROR: ${latest} size mismatch (expected ${meta_size}, got ${actual_size}), discarding" >&2
      rm -f "$tmp"
      exit 0
    fi

    mv "$tmp" "/data/${latest}"
    echo "OK: ${latest} downloaded (${actual_size} bytes)"
  # Rebuilds library.xml from scratch from whatever *.zim files are
  # currently on the PVC (rather than incrementally add/remove-by-ID),
  # then deletes any now-superseded dated file per series. Idempotent and
  # self-healing: safe to run with zero ZIM files present (first-ever
  # start), and safe to re-run after a partial sync-one.sh failure or
  # between every series in updater-cronjob.yaml's alternating
  # sync-one/reindex sequence.
  reindex.sh: |
    #!/bin/sh
    set -eu

    DATA=/data
    zims=$(ls -- "$DATA"/*.zim 2>/dev/null || true)

    if [ -n "$zims" ]; then
      rm -f "$DATA/library.xml.new"
      # shellcheck disable=SC2086
      kiwix-manage "$DATA/library.xml.new" add $zims
      mv -f "$DATA/library.xml.new" "$DATA/library.xml"
      echo "OK: library.xml rebuilt with $(printf '%s\n' "$zims" | wc -l) ZIM file(s)"
    elif [ ! -f "$DATA/library.xml" ]; then
      printf '<?xml version="1.0" encoding="UTF-8" ?>\n<library version="20110515"></library>\n' > "$DATA/library.xml"
      echo "WARN: no ZIM files present yet, wrote an empty library.xml" >&2
    fi

    for prefix in wikipedia_en_all_maxi wikiquote_en_all_maxi wikivoyage_en_all_maxi \
                  wikibooks_en_all_maxi wiktionary_en_all_nopic wikisource_en_all_maxi; do
      newest=$(ls -- "$DATA/${prefix}"_*.zim 2>/dev/null | sort | tail -n1 || true)
      [ -z "$newest" ] && continue
      for f in "$DATA/${prefix}"_*.zim; do
        [ -f "$f" ] || continue
        [ "$f" = "$newest" ] && continue
        echo "Removing superseded $(basename "$f")"
        rm -f -- "$f"
      done
    done
