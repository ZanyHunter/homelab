# The two scripts behind the update mechanism (updater-cronjob.yaml runs
# both; kiwix.yaml's Deployment also runs reindex.sh as an initContainer,
# so library.xml always exists even before the CronJob has run once --
# verified live that kiwix-serve --monitorLibrary refuses to start at all
# if the library file is simply missing, rather than waiting for it to
# appear).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wikipedia-updater-scripts
  namespace: wikipedia
data:
  # Checks download.kiwix.org for a newer dated release of each tracked
  # series and downloads it if found. Never exits non-zero: one series
  # failing (a transient network blip on the ~124GB Wikipedia Maxi file,
  # say) must not stop the others from being checked, and must not stop
  # reindex.sh from running afterwards to index whatever *did* download
  # successfully. A failed/incomplete series is simply retried on the next
  # scheduled run -- self-healing by design, matching this app's
  # re-fetchable-cache framing (no backups needed).
  #
  # Ordered smallest-series-first on purpose: proves the whole mechanism
  # end-to-end quickly (Wikiquote/Wikivoyage are ~1GB) rather than only
  # after the ~124GB Wikipedia Maxi download finishes.
  download.sh: |
    #!/bin/sh
    # No `set -e`: see the no-exit-nonzero note above.

    sync_series() {
      category="$1"
      prefix="$2"

      listing=$(curl -fsSL "https://download.kiwix.org/zim/${category}/") || {
        echo "ERROR: could not list ${category}" >&2
        return 1
      }
      latest=$(printf '%s\n' "$listing" | grep -oE "${prefix}_[0-9]{4}-[0-9]{2}\.zim" | sort -u | tail -n1)

      if [ -z "$latest" ]; then
        echo "WARN: no ${prefix} release found in ${category} listing, skipping" >&2
        return 1
      fi

      if [ -f "/data/${latest}" ]; then
        echo "OK: ${latest} already up to date"
        return 0
      fi

      echo "Downloading ${latest}..."
      meta_size=$(curl -fsSL "https://download.kiwix.org/zim/${category}/${latest}.meta4" 2>/dev/null \
        | grep -oE '<size>[0-9]+</size>' | head -n1 | grep -oE '[0-9]+')

      tmp="/data/.tmp-${latest}"
      rm -f "$tmp"
      if ! curl -fL --retry 3 -o "$tmp" "https://download.kiwix.org/zim/${category}/${latest}"; then
        echo "ERROR: download failed for ${latest}" >&2
        rm -f "$tmp"
        return 1
      fi

      actual_size=$(wc -c < "$tmp")
      if [ -n "$meta_size" ] && [ "$actual_size" != "$meta_size" ]; then
        echo "ERROR: ${latest} size mismatch (expected ${meta_size}, got ${actual_size}), discarding" >&2
        rm -f "$tmp"
        return 1
      fi

      mv "$tmp" "/data/${latest}"
      echo "OK: ${latest} downloaded (${actual_size} bytes)"
    }

    sync_series wikiquote  wikiquote_en_all_maxi
    sync_series wikivoyage wikivoyage_en_all_maxi
    sync_series wikibooks  wikibooks_en_all_maxi
    sync_series wiktionary wiktionary_en_all_nopic
    sync_series wikisource wikisource_en_all_maxi
    sync_series wikipedia  wikipedia_en_all_maxi

    exit 0
  # Rebuilds library.xml from scratch from whatever *.zim files are
  # currently on the PVC (rather than incrementally add/remove-by-ID),
  # then deletes any now-superseded dated file per series. Idempotent and
  # self-healing: safe to run with zero ZIM files present (first-ever
  # start), and safe to re-run after a partial download.sh failure.
  reindex.sh: |
    #!/bin/sh
    set -eu

    DATA=/data
    zims=$(ls -- "$DATA"/*.zim 2>/dev/null || true)

    if [ -n "$zims" ]; then
      rm -f "$DATA/library.xml.new"
      # shellcheck disable=SC2086
      kiwix-manage "$DATA/library.xml.new" add $zims
      mv -f "$DATA/library.xml.new" "$DATA/library.xml"
      echo "OK: library.xml rebuilt with $(printf '%s\n' "$zims" | wc -l) ZIM file(s)"
    elif [ ! -f "$DATA/library.xml" ]; then
      printf '<?xml version="1.0" encoding="UTF-8" ?>\n<library version="20110515"></library>\n' > "$DATA/library.xml"
      echo "WARN: no ZIM files present yet, wrote an empty library.xml" >&2
    fi

    for prefix in wikipedia_en_all_maxi wikiquote_en_all_maxi wikivoyage_en_all_maxi \
                  wikibooks_en_all_maxi wiktionary_en_all_nopic wikisource_en_all_maxi; do
      newest=$(ls -- "$DATA/${prefix}"_*.zim 2>/dev/null | sort | tail -n1 || true)
      [ -z "$newest" ] && continue
      for f in "$DATA/${prefix}"_*.zim; do
        [ -f "$f" ] || continue
        [ "$f" = "$newest" ] && continue
        echo "Removing superseded $(basename "$f")"
        rm -f -- "$f"
      done
    done
