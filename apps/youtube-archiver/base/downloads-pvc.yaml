# Downloaded video files under /downloads. Unlike the Wikipedia ZIM library,
# archived videos are NOT reliably re-fetchable -- source videos get deleted
# or made private on YouTube over time -- so this is closer to Immich's media
# library in terms of "irreplaceable if lost" risk. It's still NFS-backed
# (bulk file storage, not a database), but it deliberately does NOT get the
# `backup.velero.io/backup-volumes` annotation -- see pinchflat.yaml's
# top-of-file comment for why that's a flagged, not silently-assumed,
# decision (#54).
#
# Static PV/PVC pointing directly into Jellyfin's existing jellyfin-media NFS
# export (apps/jellyfin/base/media-pv.yaml), at a dedicated YouTube/
# subdirectory -- not a normal per-environment dynamically-provisioned PVC on
# nfs-dev/nfs-prod like this file used to be. Since Jellyfin already mounts
# that export's entire root read-only at /media, anything Pinchflat writes
# here shows up under /media/YouTube with zero changes needed on Jellyfin's
# side -- just a manually-added Library pointed at that path (see
# docs/src/explanation/self-hosted-apps.md).
#
# Deliberately shared across dev and prod, same exception as jellyfin-media
# itself, rather than the per-environment split every other app's NFS-backed
# PVC gets: the user explicitly chose simplicity (one directory, no
# per-environment tokens/exports to manage) over isolation here, having
# weighed and accepted the one real tradeoff -- if dev's and prod's
# subscriptions ever overlap, both could write the same filename around the
# same time (a harmless same-content overwrite in practice, not corruption).
# This is why storageClassName/capacity are fixed values below rather than
# env-values.yaml tokens.
#
# accessModes: ReadWriteMany (not Jellyfin's ReadOnlyMany) and no
# mountOptions: [ro] -- Pinchflat needs to write here, unlike Jellyfin's own
# read-only mount of the export root.
#
# persistentVolumeReclaimPolicy: Retain -- same reasoning as jellyfin-media:
# deleting this PVC/PV must never delete real downloaded videos.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pinchflat-downloads
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: truenas.thepugh.family
    path: /mnt/Main/jellyfin-media/YouTube
  claimRef:
    namespace: youtube-archiver
    name: pinchflat-downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pinchflat-downloads
  namespace: youtube-archiver
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: pinchflat-downloads
  resources:
    requests:
      storage: 500Gi
