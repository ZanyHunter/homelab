# The per-environment values this app's base/ manifests reference as
# __APP_HOSTNAME__/__STORAGE_CLASS_CEPH__/__STORAGE_CLASS_NFS__/
# __DOWNLOADS_PVC_SIZE__ tokens -- see
# docs/src/explanation/gitops-app-of-apps.md for the base/overlays pattern.
#
# downloads-pvc-size is small (20Gi), not prod's 500Gi: unlike Wikipedia's
# fixed ZIM catalog, there's no natural content subset to scope dev down to
# here -- growth depends entirely on which channels get subscribed to. 20Gi
# is enough to prove the subscribe-and-download pipeline live without
# carrying a large permanent footprint on a dev-only testing cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
data:
  app-hostname: youtube.dev.thepugh.family
  storage-class-ceph: ceph-rbd-dev
  storage-class-nfs: nfs-dev
  downloads-pvc-size: 20Gi
