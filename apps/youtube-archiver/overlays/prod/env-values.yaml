# The per-environment values this app's base/ manifests reference as
# __APP_HOSTNAME__/__STORAGE_CLASS_CEPH__/__STORAGE_CLASS_NFS__/
# __DOWNLOADS_PVC_SIZE__ tokens -- see
# docs/src/explanation/gitops-app-of-apps.md for the base/overlays pattern.
#
# downloads-pvc-size is 500Gi per #54's own "size generously" guidance --
# growth depends entirely on real subscription count/frequency, and PVCs
# can only grow, never shrink, so this is a floor to raise later rather
# than a hard ceiling.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
data:
  app-hostname: youtube.thepugh.family
  storage-class-ceph: ceph-rbd-prod
  storage-class-nfs: nfs-prod
  downloads-pvc-size: 500Gi
