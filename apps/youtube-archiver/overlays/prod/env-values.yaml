# The per-environment values this app's base/ manifests reference as
# __APP_HOSTNAME__/__KEYCLOAK_HOSTNAME__/__STORAGE_CLASS_CEPH__ tokens -- see
# docs/src/explanation/gitops-app-of-apps.md for the base/overlays pattern.
# keycloak-hostname is for oauth2-proxy.yaml's own OIDC discovery calls,
# not Pinchflat itself (no native OIDC support).
#
# No storage-class-nfs/downloads-pvc-size here: the downloads PVC
# (downloads-pvc.yaml) is a static PV/PVC shared with Jellyfin's media
# export, deliberately not per-environment -- see that file's own comment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
data:
  app-hostname: youtube.thepugh.family
  keycloak-hostname: keycloak.thepugh.family
  storage-class-ceph: ceph-rbd-prod
