# Tool version manager (https://mise.jdx.dev/) for every CLI this repo's
# development and deployment workflow needs — see CLAUDE.md's Toolchain
# section and docs/src/guides/deploy-from-scratch.md for how each is used.
#
# One-time setup on a new machine (after installing mise itself, see
# https://mise.jdx.dev/installing-mise.html):
#   mise trust
#   mise install
#
# Bumping a version: edit the pin below, then `mise install` again. velero
# specifically must stay in lockstep with chart_versions.velero in
# tofu/live/<env>/env.hcl — see docs/src/explanation/backup-and-restore.md.

[tools]
opentofu = "1.12.6"
terragrunt = "1.1.4"
sops = "3.13.3"
age = "1.3.1"
gh = "2.98.0"
kubectl = "1.34.11"
mdbook = "0.5.4"
rust = "1.98.0"
"cargo:mdbook-tabs" = "1.0.4"
velero = "1.18.1"
